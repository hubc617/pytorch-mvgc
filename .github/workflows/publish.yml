name: Publish to PyPI

"on":
  workflow_dispatch:
    inputs:
      version:
        description: Version already declared in setup.py
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pypi-publish
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ".[test]" build twine
      - name: Check requested version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python -c "import os, subprocess; actual = subprocess.check_output(['python', 'setup.py', '--version'], text=True).strip(); assert actual == os.environ['RELEASE_VERSION'], (actual, os.environ['RELEASE_VERSION'])"
      - run: python -m pytest -q
      - run: python -m build
      - run: python -m twine check dist/*
      - run: sha256sum dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pytorch-mvgc/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - name: Publish verified distributions
        uses: pypa/gh-action-pypi-publish@release/v1
